syntax = "proto3";

package inventory;

option go_package = "github.com/xrekson/game-backend/proto/inventory;inventorypb";

enum ItemType {
  WEAPON = 0;
  ARMOUR = 1;
  ARMAMENT = 2;
}

message ItemAttribute {
  string key = 1;
  string type = 2;             // "DAMAGE", "BUFF", "EXP_BONUS", "GOLD_BONUS", "SPECIAL"
  string value = 3;            // e.g. "15", "1.2", "20%"
  string calculation_expr = 4; // e.g. "base_atk * 1.25", "xp * 1.20"
}

message Item {
  string id = 1;
  string template_id = 2;
  string player_id = 3;
  string name = 4;
  ItemType type = 5;
  double attack = 6;
  double defense = 7;
  string rarity = 8;
  bool is_equipped = 9;
  double price = 10;
  bool has_attributes = 11;
  repeated ItemAttribute attributes = 12;
}

message ItemTemplate {
  string template_id = 1;
  string name = 2;
  ItemType type = 3;
  double base_attack = 4;
  double base_defense = 5;
  string rarity = 6;
  double base_price = 7;
  bool has_attributes = 8;
  repeated ItemAttribute attributes = 9;
}

message GetInventoryRequest {
  string player_id = 1;
}

message GetInventoryResponse {
  repeated Item items = 1;
}

message EquipItemRequest {
  string player_id = 1;
  string item_id = 2;
}

message EquipItemResponse {
  bool success = 1;
  Item item = 2;
}

message UnequipItemRequest {
  string player_id = 1;
  string item_id = 2;
}

message UnequipItemResponse {
  bool success = 1;
  Item item = 2;
}

message AddItemRequest {
  string player_id = 1;
  string template_id = 2;
}

message AddItemResponse {
  bool success = 1;
  Item item = 2;
}

message RemoveItemRequest {
  string player_id = 1;
  string item_id = 2;
}

message RemoveItemResponse {
  bool success = 1;
}

message GetItemTemplatesRequest {}

message GetItemTemplatesResponse {
  repeated ItemTemplate templates = 1;
}

message CreateItemTemplateRequest {
  ItemTemplate template = 1;
}

message CreateItemTemplateResponse {
  bool success = 1;
  ItemTemplate template = 2;
}

message UpdateItemTemplateRequest {
  ItemTemplate template = 1;
}

message UpdateItemTemplateResponse {
  bool success = 1;
  ItemTemplate template = 2;
}

service InventoryService {
  rpc GetInventory (GetInventoryRequest) returns (GetInventoryResponse);
  rpc EquipItem (EquipItemRequest) returns (EquipItemResponse);
  rpc UnequipItem (UnequipItemRequest) returns (UnequipItemResponse);
  rpc AddItem (AddItemRequest) returns (AddItemResponse);
  rpc RemoveItem (RemoveItemRequest) returns (RemoveItemResponse);
  rpc GetItemTemplates (GetItemTemplatesRequest) returns (GetItemTemplatesResponse);
  rpc CreateItemTemplate (CreateItemTemplateRequest) returns (CreateItemTemplateResponse);
  rpc UpdateItemTemplate (UpdateItemTemplateRequest) returns (UpdateItemTemplateResponse);
}
