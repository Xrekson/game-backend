syntax = "proto3";

package world;

option go_package = "github.com/xrekson/game-backend/proto/world;worldpb";

service WorldService {
  rpc GetMapLayout (GetMapLayoutRequest) returns (GetMapLayoutResponse);
  rpc ValidateMovement (ValidateMovementRequest) returns (ValidateMovementResponse);
  rpc ResolveCombat (ResolveCombatRequest) returns (ResolveCombatResponse);
}

message Position {
  double x = 1;
  double y = 2;
}

message PlayerState {
  string player_id = 1;
  string map_id = 2;
  Position position = 3;
  double hp = 4;
  double max_hp = 5;
  bool is_safe_zone = 6;
}

message MapLayout {
  string map_id = 1;
  string name = 2;
  double width = 3;
  double height = 4;
  bool is_safe_zone = 5;
  Position spawn_point = 6;
}

message GetMapLayoutRequest {
  string map_id = 1;
}

message GetMapLayoutResponse {
  MapLayout map = 1;
}

message ValidateMovementRequest {
  string player_id = 1;
  string map_id = 2;
  Position new_position = 3;
}

message ValidateMovementResponse {
  bool valid = 1;
  Position validated_position = 2;
  bool is_safe_zone = 3;
}

message ResolveCombatRequest {
  string player_id = 1;
  string enemy_id = 2;
  double damage = 3;
}

message ResolveCombatResponse {
  bool enemy_defeated = 1;
  double damage_dealt = 2;
  double remaining_enemy_hp = 3;
  double reward_gold = 4;
  int64 reward_xp = 5;
}
